[project]
name = "wb-bad-review-tracker"
version = "1.0.0"
description = "Wb feedbacks scrapper as test task"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # A database migrations tool for TortoiseORM
    "aerich>=0.9.1",
    # AsyncClick is a fork of Click, Click is a Python package
    # for creating command line interfaces
    "asyncclick>=8.2.2.2",
    # asyncpg is a database interface library
    # designed specifically for PostgreSQL
    "asyncpg>=0.30.0",
    # fully featured HTTP client for Python 3
    "httpx>=0.28.1",
    # Implements request retry for HTTPX
    "httpx-retries>=0.4.2",
    # Pydantic is the most widely used data validation library for Python
    "pydantic>=2.11.9",
    # Settings management using Pydantic
    "pydantic-settings>=2.10.1",
    # Pretty-print tabular data in Python
    "tabulate>=0.9.0",
    # Familiar asyncio ORM for python
    "tortoise-orm>=0.25.1",
]

[tool.aerich]
tortoise_orm = "core.config.tortoise_settings"
location = "core/models/migrations"
